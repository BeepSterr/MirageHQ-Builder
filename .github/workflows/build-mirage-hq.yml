name: Build MirageHQ Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest TOU-Mira release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo AU-Avengers/TOU-Mira --json tagName --jq .tagName)
          mkdir -p release
          gh release download "$tag" --repo AU-Avengers/TOU-Mira --pattern '*.zip' --dir release
          ls -la release

      - name: Inject MirageHQ files into each release bundle
        id: bundles
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          # Every mapping destination lives under the same top-level folder
          # (BepInEx); locating it is how we find where to inject.
          marker=$(jq -r '[.[] | split("/")[0]] | unique | .[0]' mapping.json)
          for zip in release/*.zip; do
            name=$(basename "$zip" .zip)
            dest="out/$name"
            mkdir -p "$dest"
            unzip -q "$zip" -d "$dest"
            # Upstream's folder inside the zip is not named after the zip file
            # (v1.7.3 uses dots in the filename and spaces in the folder), so
            # anchor on the marker directory rather than assuming they match.
            root=$(find "$dest" -maxdepth 2 -type d -name "$marker" -printf '%h\n' | head -1)
            if [ -z "$root" ]; then
              echo "::error::no '$marker' directory found in $name - upstream layout changed" >&2
              exit 1
            fi
            while IFS=$'\t' read -r src dst; do
              mkdir -p "$root/$(dirname "$dst")"
              cp "assets/$src" "$root/$dst"
            done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' mapping.json)
          done
          find out -maxdepth 2
          echo "steam_itch=$(basename out/*steam-itch*)" >> "$GITHUB_OUTPUT"
          echo "epic_msstore=$(basename out/*epic-msstore*)" >> "$GITHUB_OUTPUT"
          echo "macos_linux=$(basename out/*macOS-linux*)" >> "$GITHUB_OUTPUT"

      - name: Upload steam-itch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundles.outputs.steam_itch }}
          path: out/${{ steps.bundles.outputs.steam_itch }}
          if-no-files-found: error

      - name: Upload epic-msstore
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundles.outputs.epic_msstore }}
          path: out/${{ steps.bundles.outputs.epic_msstore }}
          if-no-files-found: error

      - name: Upload macOS-linux
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundles.outputs.macos_linux }}
          path: out/${{ steps.bundles.outputs.macos_linux }}
          if-no-files-found: error
