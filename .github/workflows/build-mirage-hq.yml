name: Build MirageHQ Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest TOU-Mira release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo AU-Avengers/TOU-Mira --json tagName --jq .tagName)
          mkdir -p release
          gh release download "$tag" --repo AU-Avengers/TOU-Mira --pattern '*.zip' --dir release
          ls -la release

      - name: Inject MirageHQ files into each zip
        id: zips
        run: |
          set -euo pipefail
          mkdir -p out
          for zip in release/*.zip; do
            name=$(basename "$zip")
            root="${name%.zip}"
            work=$(mktemp -d)
            unzip -q "$zip" -d "$work"
            while IFS=$'\t' read -r src dst; do
              mkdir -p "$work/$root/$(dirname "$dst")"
              cp "assets/$src" "$work/$root/$dst"
            done < <(jq -r 'to_entries[] | "\(.key)\t\(.value)"' mapping.json)
            (cd "$work" && zip -qr "$GITHUB_WORKSPACE/out/$name" .)
          done
          ls -la out
          echo "steam_itch=$(basename out/*steam-itch*.zip)" >> "$GITHUB_OUTPUT"
          echo "epic_msstore=$(basename out/*epic-msstore*.zip)" >> "$GITHUB_OUTPUT"
          echo "macos_linux=$(basename out/*macOS-linux*.zip)" >> "$GITHUB_OUTPUT"

      - name: Upload steam-itch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zips.outputs.steam_itch }}
          path: out/${{ steps.zips.outputs.steam_itch }}
          if-no-files-found: error

      - name: Upload epic-msstore
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zips.outputs.epic_msstore }}
          path: out/${{ steps.zips.outputs.epic_msstore }}
          if-no-files-found: error

      - name: Upload macOS-linux
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zips.outputs.macos_linux }}
          path: out/${{ steps.zips.outputs.macos_linux }}
          if-no-files-found: error
